.java:init:
  image:
    name: ${BUILD_IMAGE_NAME}
  before_script:
    - |
        if [ ! -z $CA_BUNDLE ]; then
          DEFAULT_TRUSTSTORE="$JAVA_HOME/lib/security/cacerts"
          DEFAULT_TRUSTSTORE_PASS="changeit"
          keytool -import -alias mavensrv -file "$CA_BUNDLE" -keystore "$DEFAULT_TRUSTSTORE" -storepass "$DEFAULT_TRUSTSTORE_PASS" -noprompt
        fi
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .m2/repository/

.java:sonar:
  extends: .java:init
  variables:
    GIT_DEPTH: "0"
  script:
    - cd $WORKING_DIR
    - mvn $MAVEN_CLI_OPTS -ntp -s $MVN_CONFIG_FILE -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository clean package
    - |
      mvn $MAVEN_CLI_OPTS -ntp -s $MVN_CONFIG_FILE -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar -Dsonar.projectName=$PROJECT_NAME -Dsonar.projectKey=$PROJECT_KEY -Dsonar.token=$SONAR_TOKEN -Dhttps.proxyHost=$PROXY_HOST -Dhttps.proxyPort=$PROXY_PORT || echo "ATTENTION : l'analyse SonarQube a échoué, le pipeline continue."
